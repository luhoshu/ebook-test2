  <script>
    const chapters = [{"number": 1, "key": "1", "title": "鐵皮屋頂救災墜落預防", "sourceTextName": "01.txt", "sourceAudioName": "", "html": "<h3>影片教學與表單測驗</h3>\n<p>鐵皮屋、採光罩及加蓋屋頂在救災現場具有高度墜落風險。高溫弱化、材質脆化或支撐位置不明，都可能造成踩空意外。</p>\n<p>本教材以「不盲目跨步」為核心原則，提醒消防人員執行高處作業時，應先確認固定螺絲線、骨架或實體支撐位置，並運用「退、探、建」建立安全行動路徑。</p>\n<h3>影片教學</h3>\n<p>請先觀看教學影片，了解鐵皮屋頂、採光罩等高處環境的常見風險，以及現場移動與路徑判斷重點。</p>\n<p>影片連結： <a href=\"https://youtu.be/E8CL88yEBrU\" target=\"_blank\" rel=\"noopener noreferrer\">https://youtu.be/E8CL88yEBrU</a></p>\n<h3>表單測驗</h3>\n<p>完成影片觀看後，請填寫表單測驗，協助確認學習成效，並強化高處救災安全觀念。</p>\n<p>測驗連結： <a href=\"https://script.google.com/macros/s/AKfycby4x3zPII4OIWnzPcX4t7gxE0CAPhkROWhGGJ7Kt7IK9qdGbVd0GxtTPeV0by4F1b0d/exec\" target=\"_blank\" rel=\"noopener noreferrer\">https://script.google.com/macros/s/AKfycby4x3zPII4OIWnzPcX4t7gxE0CAPhkROWhGGJ7Kt7IK9qdGbVd0GxtTPeV0by4F1b0d/exec</a></p>\n<h3>重點提醒</h3>\n<p><strong>不盲目跨步，是高處救災的第一道防線。</strong> <strong>先退、再探、後建立路徑，確保人員安全再執行任務。</strong></p>", "audio": "", "audioMediaType": ""}, {"number": 2, "key": "2", "title": "從事故學會避免下一次墜落", "sourceTextName": "02.txt", "sourceAudioName": "", "html": "<p>本書從一件住宅火警高處墜落案例出發，整理消防人員在鐵皮構造、採光罩、浪板、頂樓加蓋與其他未知踩踏面作業時，最容易忽略的風險。</p>\n<p>核心不是記住某一起事故，而是建立可重複使用的安全判斷程序：先辨識材質，再確認支撐；先探測路徑，再移動身體；無法確認時，就不要把重量交給未知表面。</p>\n<p>本書要反覆提醒五件事： 到梯頂，先停步。 腳出去，先探路。 材質不明，當禁區。 無探測，不跨步。 沒有路，先建路。</p>", "audio": "", "audioMediaType": ""}, {"number": 3, "key": "3", "title": "住宅火警事故經過", "sourceTextName": "03.txt", "sourceAudioName": "", "html": "<p>某次住宅火警，現場有頂樓加蓋鐵皮構造與雜物燃燒。搶救過程中，因原有入口受阻，消防人員改由梯具前往較高樓層尋找進入路線。</p>\n<p>人員到達上方後，行經接近入口的採光罩區域，板材突然破裂，造成墜落受傷。後續現場持續進行火勢控制與人員救護。</p>\n<p>這起事故提醒我們：高處墜落風險常發生在任務初期，尤其是急著建立入口、改變進入路線，或準備從梯頂踏出第一步的時候。</p>", "audio": "", "audioMediaType": ""}, {"number": 4, "key": "4", "title": "危險常在入口附近", "sourceTextName": "04.txt", "sourceAudioName": "", "html": "<p>高處危險不一定出現在屋頂深處，也可能就在入口、門廊、雨遮或梯頂旁邊。</p>\n<p>當一樓入口無法使用，消防人員可能改由架梯上樓、翻窗或從其他高處位置進入。但只要梯頂外側是鐵皮、浪板、採光罩、雨遮或不明板材，就不能直接把它視為安全立足點。</p>\n<p>最容易被忽略的，往往不是上梯本身，而是離開梯子後的第一步。</p>\n<p>梯子讓你上去，不代表你可以直接走出去。</p>", "audio": "", "audioMediaType": ""}, {"number": 5, "key": "5", "title": "採光罩可能瞬間失效", "sourceTextName": "05.txt", "sourceAudioName": "", "html": "<p>採光罩、塑膠浪板或老化透明板材，主要功能是採光或遮蔽，不應視為可供人員踩踏的承重面。</p>\n<p>當消防人員把身體與裝備重量交給這類板材時，板材可能不是慢慢變形，而是突然破裂，形成大面積孔洞，使人員直接跌落到下方空間。</p>\n<p>消防人員穿著防護裝備並攜帶器材時，總重量更高，風險也會隨之增加。</p>\n<p>採光罩不是立足點，也不是臨時平台。不要用身體測試板材強度。</p>", "audio": "", "audioMediaType": ""}, {"number": 6, "key": "6", "title": "梯頂到入口的幾步最危險", "sourceTextName": "06.txt", "sourceAudioName": "", "html": "<p>很多人會注意梯具是否穩固，卻容易忽略梯頂外側的水平移動路徑。</p>\n<p>真正的危險，可能就在離開梯子後、前往門口或窗戶的短短幾步。如果前方是採光罩、浪板、雨遮或不明材質，即使距離很短，也可能在第一步就發生墜落。</p>\n<p>到達梯頂後，第一個動作不應是立刻踏出去，而是停下來確認前方材質、支撐位置與下一個安全立足點。</p>\n<p>到梯頂，先停步；腳出去，先探路。</p>", "audio": "", "audioMediaType": ""}, {"number": 7, "key": "7", "title": "事故鏈怎麼形成", "sourceTextName": "07.txt", "sourceAudioName": "", "html": "<p>高處墜落通常不是單一原因造成，而是一連串條件累積的結果。</p>\n<p>入口受阻，改由梯具上樓。 前方是鐵皮構造與採光罩混合區。 任務壓力升高，急著建立進入路線。 踩踏材質與下方支撐沒有完全確認。 人員將重量移到未知板面。 板材破裂，發生墜落。</p>\n<p>事故不是從板材破裂那一刻才開始，而是從未知踩踏面沒有被確認時，風險就已經開始累積。</p>", "audio": "", "audioMediaType": ""}, {"number": 8, "key": "8", "title": "事故鏈可以在哪裡中斷", "sourceTextName": "08.txt", "sourceAudioName": "", "html": "<p>高處墜落並不是只能在最後一刻避免。只要在其中任何一個環節停下來重新判斷，就有機會中斷事故鏈。</p>\n<p>上梯前，先觀察上方是否有採光罩、浪板或不明板材。 到達梯頂後，先確認第一個立足點。 腳踏出去前，先用工具探測。 看見半透明、塑膠、浪板或無法辨識的材質，先視為禁區。 無法確認支撐時，改選入口或建立人工安全路徑。</p>\n<p>安全不是靠運氣，而是靠每一步確認。</p>", "audio": "", "audioMediaType": ""}, {"number": 9, "key": "9", "title": "五句安全金律", "sourceTextName": "09.txt", "sourceAudioName": "", "html": "<p>本書所有高處作業觀念，可以濃縮成五句安全金律：</p>\n<p>到梯頂，先停步。 腳出去，先探路。 材質不明，當禁區。 無探測，不跨步。 沒有路，先建路。</p>\n<p>這五句不是口號，而是現場行動順序。當火場環境緊迫、視線不佳、任務壓力升高時，更需要用固定程序取代直覺反應。</p>", "audio": "", "audioMediaType": ""}, {"number": 10, "key": "10", "title": "看起來像屋面，不代表能承重", "sourceTextName": "10.txt", "sourceAudioName": "", "html": "<p>採光罩、塑膠浪板與鐵皮浪板，外觀可能非常相似，也可能混合安裝在同一個屋面。</p>\n<p>外型相似，不代表材質相同；材質相同，也不代表支撐方式相同；表面看起來完整，更不代表能承受消防人員與裝備的重量。</p>\n<p>判斷重點不是「看起來像不像鐵皮」，而是腳下是否有可以確認的承重結構。</p>\n<p>看不出來，就不要踩。</p>", "audio": "", "audioMediaType": ""}, {"number": 11, "key": "11", "title": "採光罩是隱形陷阱", "sourceTextName": "11.txt", "sourceAudioName": "", "html": "<p>採光罩常出現在鐵皮屋、頂樓加蓋、廠房、門廊、雨遮與住宅增建空間。它的用途是採光，不是承重。</p>\n<p>在火場中，採光罩可能被煙霧、灰塵、青苔、水漬、雜物或光線影響而難以辨識。當採光罩與鐵皮浪板混合排列時，更容易被誤判成可以通行的屋面。</p>\n<p>只要看到半透明、塑膠、老化或材質不明的板面，就應提高警覺。</p>\n<p>採光罩不是路，是陷阱。</p>", "audio": "", "audioMediaType": ""}, {"number": 12, "key": "12", "title": "火場會放大誤判", "sourceTextName": "12.txt", "sourceAudioName": "", "html": "<p>火場不是一般環境。濃煙、熱氣、水霧、反光、照明不足、射水後濕滑與雜物遮蔽，都可能讓視覺判斷變得不可靠。</p>\n<p>任務越急，人員越容易把「看起來可以走」誤判成「真的可以承重」。尤其當入口受阻、搶救進度受限或必須快速改變路線時，更容易省略確認步驟。</p>\n<p>火場中最危險的，不一定是看得見的火，也可能是你以為安全的那一步。</p>\n<p>現場越急，越要停下來確認。</p>", "audio": "", "audioMediaType": ""}, {"number": 13, "key": "13", "title": "高溫會削弱結構", "sourceTextName": "13.txt", "sourceAudioName": "", "html": "<p>鐵皮、浪板、橫樑與支撐構件在火場高溫下可能變形或弱化。即使外觀看起來完整，下方支撐能力也可能已經下降。</p>\n<p>因此，高處作業不能只靠肉眼判斷，還要注意火勢位置、受熱時間、煙流、熱異常與結構變形跡象。</p>\n<p>如果前方區域正受到高溫影響，就應重新評估是否適合通行，必要時退回已確認的安全位置。</p>\n<p>表面完整，不代表結構安全。</p>", "audio": "", "audioMediaType": ""}, {"number": 14, "key": "14", "title": "鐵皮多半只是覆蓋物", "sourceTextName": "14.txt", "sourceAudioName": "", "html": "<p>鐵皮屋頂或鐵皮加蓋的板面，通常只是覆蓋材料，不是主要承重結構。</p>\n<p>真正承受重量的，是下方的鋼柱、橫樑、檁條或其他支撐系統。如果人員把重量放在板面中央，而下方沒有可靠支撐，就可能發生變形、破裂或踩空。</p>\n<p>移動時應把注意力放在「下方有沒有結構」，而不是只看表面是否完整。</p>\n<p>不要把重量交給表面，要交給結構。</p>", "audio": "", "audioMediaType": ""}, {"number": 15, "key": "15", "title": "固定螺絲線是重要線索", "sourceTextName": "15.txt", "sourceAudioName": "", "html": "<p>鐵皮屋面上的固定螺絲，常可以作為判斷下方支撐位置的線索。螺絲排列方向，通常與橫樑、檁條或其他固定構件有關。</p>\n<p>當必須在鐵皮構造附近移動時，可以利用螺絲線協助判斷可能的支撐位置，並搭配目視、工具探測與現場條件綜合確認。</p>\n<p>但要注意，螺絲線只能作為線索，不能當成絕對安全保證。</p>\n<p>找螺絲線，就是找可能的支撐線。</p>", "audio": "", "audioMediaType": ""}, {"number": 16, "key": "16", "title": "無螺絲、無支撐、無確認，就當禁區", "sourceTextName": "16.txt", "sourceAudioName": "", "html": "<p>如果一個區域沒有明顯固定螺絲、看不出下方支撐、材質不明，或表面疑似採光罩、塑膠浪板，就不應直接踩踏。</p>\n<p>不要用腳去確認。 不要因為距離短就冒險跨越。 不要因為任務緊急就省略判斷。 不要因為表面完整就相信它可以承重。</p>\n<p>只要無法確認，就先當成禁區。</p>", "audio": "", "audioMediaType": ""}, {"number": 17, "key": "17", "title": "靠主結構，不走薄弱區", "sourceTextName": "17.txt", "sourceAudioName": "", "html": "<p>在鐵皮屋、頂樓加蓋或高處平台移動時，路線應優先靠近可以辨識的主結構。</p>\n<p>主結構可能包括鋼柱、外牆、樑柱交會處或其他明確支撐位置。相較之下，板面中央、採光罩、浪板、臨時加蓋、老舊雨遮與支撐不明區域，都屬於高風險位置。</p>\n<p>路線判斷不能只看哪裡最近，而要看哪裡有可靠結構。</p>\n<p>不是哪裡近就走哪裡，而是哪裡有結構才走哪裡。</p>", "audio": "", "audioMediaType": ""}, {"number": 18, "key": "18", "title": "無探測，不跨步", "sourceTextName": "18.txt", "sourceAudioName": "", "html": "<p>當前方踏點不明、材質不明或支撐不明時，不要直接跨步。</p>\n<p>正確順序是： 先停。 先看。 先確認。 先用工具探測。 確認後，再移動身體重量。</p>\n<p>可以利用火斧、撬棒、手電筒或其他適當器材，先對前方踏點進行輕敲、施壓或觸探，再決定是否移動。</p>\n<p>腳不要先出去，工具要先出去。</p>", "audio": "", "audioMediaType": ""}, {"number": 19, "key": "19", "title": "工具是觸覺延伸", "sourceTextName": "19.txt", "sourceAudioName": "", "html": "<p>火斧、撬棒、手電筒或其他適當器材，不只是破壞工具，也可以成為高處作業時的觸覺延伸。</p>\n<p>移動前，可以先用工具輕敲、施壓或觸探前方，確認是否有空洞感、異常彈性、破裂聲、鬆動或支撐不足。</p>\n<p>如果工具探測已出現異常，就不能再用身體重量測試。</p>\n<p>工具先出去，是為了讓危險先被發現，而不是讓人員先承受後果。</p>", "audio": "", "audioMediaType": ""}, {"number": 20, "key": "20", "title": "一步一確認，不搶那一步", "sourceTextName": "20.txt", "sourceAudioName": "", "html": "<p>火場搶救講求速度，但速度不能建立在未知風險上。高處作業真正有效率的推進，是每一步都知道自己踩在哪裡。</p>\n<p>搶一步，可能造成隊員墜落受傷。 搶一步，可能讓原本的任務被迫中斷。 搶一步，也可能讓救災行動變成救援自己人。</p>\n<p>一步一確認，看似比較慢，其實是在維持整體戰力。</p>\n<p>慢一步確認，是為了不中斷任務。</p>", "audio": "", "audioMediaType": ""}, {"number": 21, "key": "21", "title": "低姿移動，分散重量", "sourceTextName": "21.txt", "sourceAudioName": "", "html": "<p>在鐵皮屋頂、受損樓板、採光罩附近或不穩定板面上移動時，不宜直立快速行走。</p>\n<p>採取較低姿勢，可以降低重心、增加身體接觸面積，並減少重量集中在單一位置的情形。當環境濕滑或結構不穩時，也較有利於控制身體平衡。</p>\n<p>但低姿移動不能取代路徑確認。前方材質與支撐仍然必須先確認。</p>\n<p>能低不要高，能分散不要集中。</p>", "audio": "", "audioMediaType": ""}, {"number": 22, "key": "22", "title": "TIC 不只是找火點", "sourceTextName": "22.txt", "sourceAudioName": "", "html": "<p>熱顯像儀除了搜尋火點，也可以協助觀察屋面、牆面、夾層或結構附近是否出現熱異常。</p>\n<p>如果某一區域溫度明顯升高，代表下方可能有火勢接近，或結構正在受到高溫影響。即使表面看起來沒有破損，也不能因此認定它仍然具備安全承載能力。</p>\n<p>熱異常應被視為重新評估路徑的重要警訊。</p>\n<p>高溫不是只有火點，也是結構警訊。</p>", "audio": "", "audioMediaType": ""}, {"number": 23, "key": "23", "title": "高溫區就是警戒區", "sourceTextName": "23.txt", "sourceAudioName": "", "html": "<p>看到熱異常區時，不只要問「火在哪裡」，還要問「這裡還能不能安全通行」。</p>\n<p>外觀看似完整的鐵皮、浪板或樓板，如果下方持續受熱，支撐能力可能已經下降。這時應重新判斷路徑，必要時退回安全點。</p>\n<p>高溫區、煙竄區、變形區、異音區與焦黑區，都應提高警覺。</p>\n<p>看見熱異常，就要重新判斷路徑。</p>", "audio": "", "audioMediaType": ""}, {"number": 24, "key": "24", "title": "用梯具建立人工安全路徑", "sourceTextName": "24.txt", "sourceAudioName": "", "html": "<p>當現場板材不明、支撐不明、踩踏面不可靠時，不應要求人員直接跨越。</p>\n<p>可以視現場條件，利用梯具或其他適當器材建立人工安全路徑，讓重量跨越多個較可靠的支撐位置，減少人員直接踩踏未知板面的機會。</p>\n<p>沒有安全路，就先建路。 建好路，再作業。 作業後，沿已確認的安全路徑撤離。</p>\n<p>不要硬走未知區，要建立受控路徑。</p>", "audio": "", "audioMediaType": ""}, {"number": 25, "key": "25", "title": "架梯上樓後，還有第二段安全路徑", "sourceTextName": "25.txt", "sourceAudioName": "", "html": "<p>架梯上樓只完成垂直移動，不代表水平移動已經安全。</p>\n<p>從梯頂到門口、窗戶、平台或作業位置之間，仍可能存在採光罩、浪板、雨遮、鐵皮加蓋或其他不明材質。</p>\n<p>因此，到達梯頂後仍要重新確認前方第一個立足點，必要時停下、探測、請求協助或建立第二段安全路徑。</p>\n<p>梯頂不是安全點，確認後的立足點才是安全點。</p>", "audio": "", "audioMediaType": ""}, {"number": 26, "key": "26", "title": "PPE 是最後防線，不是通行許可", "sourceTextName": "26.txt", "sourceAudioName": "", "html": "<p>消防衣、消防帽、消防鞋、手套與空氣呼吸器，是消防人員執行任務時的重要防護裝備。</p>\n<p>但完整的個人防護裝備，不能讓採光罩變成可承重平台，也不能讓受熱、老化或支撐不足的板面恢復安全。</p>\n<p>PPE 的作用，是在風險發生時提供最後一層保護，而不是取代路徑判斷、結構確認與安全程序。</p>\n<p>PPE 保護你，但不替你判斷路。</p>", "audio": "", "audioMediaType": ""}, {"number": 27, "key": "27", "title": "退、探、建", "sourceTextName": "27.txt", "sourceAudioName": "", "html": "<p>當完全找不到安全路徑，或不確定前方是否能通行時，不要硬闖。</p>\n<p>可以用三個字記住處理順序：退、探、建。</p>\n<p>退：退回已確認的安全立足點。 探：利用目視、照明、工具或熱顯像儀重新確認前方狀況。 建：必要時利用梯具或其他器材建立人工安全路徑。</p>\n<p>退不是放棄，而是重新取得安全主導權。</p>", "audio": "", "audioMediaType": ""}, {"number": 28, "key": "28", "title": "帶隊官要問的三句話", "sourceTextName": "28.txt", "sourceAudioName": "", "html": "<p>高處遇到未知踩踏面時，帶隊官、指揮人員或前進人員都可以先問三句話：</p>\n<p>第一，前方材質是什麼？ 第二，下方有沒有支撐？ 第三，退路在哪裡？</p>\n<p>如果其中任何一題答不出來，就不應直接推進。</p>\n<p>這三句話可以反覆用在架梯上樓、屋頂作業、頂樓加蓋、鐵皮雨遮、夾層或採光罩附近。</p>\n<p>問清楚，再前進；答不出來，就先停。</p>", "audio": "", "audioMediaType": ""}, {"number": 29, "key": "29", "title": "架梯上樓安全檢核", "sourceTextName": "29.txt", "sourceAudioName": "", "html": "<p>架梯上樓時，可以依序做以下檢核：</p>\n<p>上梯前先看：目標位置前方是否有採光罩、浪板、雨遮或不明材質？ 梯頂先停：不要一到梯頂就直接踏出。 腳出前先探：用工具確認第一個立足點與下一步路徑。 材質不明不踩：半透明、塑膠、老化、髒污或支撐不明者，先視為禁區。 無安全路就改戰術：退回、改入口或建立人工安全路徑。</p>\n<p>把提醒變成固定程序，現場才真正做得到。</p>", "audio": "", "audioMediaType": ""}, {"number": 30, "key": "30", "title": "採光罩與浪板辨識提醒", "sourceTextName": "30.txt", "sourceAudioName": "", "html": "<p>看到以下特徵時，應提高警覺：</p>\n<p>半透明或透光。 顏色泛黃、泛綠或不均。 表面老化、髒污、青苔或脆化。 沒有明顯固定螺絲線。 板面有彈性、晃動或空洞感。 與鐵皮浪板混合排列。 位於門廊、雨遮、頂樓加蓋或入口前方。</p>\n<p>如果無法確認是不是採光罩，就不要賭它可以承重。</p>\n<p>可疑材質，先當不可踩。</p>", "audio": "", "audioMediaType": ""}, {"number": 31, "key": "31", "title": "如果重來一次，哪裡可以中斷事故", "sourceTextName": "31.txt", "sourceAudioName": "", "html": "<p>重新檢視高處墜落事故，可以發現通常有不只一個中斷點。</p>\n<p>上梯前，先觀察上方入口前方的材質。 到達梯頂後，先停下確認立足點。 離開梯子前，先用工具探測。 發現疑似採光罩或浪板時，不直接踩踏。 無法確認支撐時，改選入口或建立安全路徑。 帶隊人員再次確認前方材質、支撐與退路。</p>\n<p>事故檢討的目的，不是責備個人，而是讓下一次任務有更好的程序。</p>\n<p>中斷事故鏈，就是保護隊員。</p>", "audio": "", "audioMediaType": ""}, {"number": 32, "key": "32", "title": "情境判斷練習", "sourceTextName": "32.txt", "sourceAudioName": "", "html": "<p>請判斷以下情境是否安全：</p>\n<p>一、梯頂外側是半透明浪板，但距離入口只有一步，可以快速跨過。</p>\n<p>二、屋面看起來完整，但沒有固定螺絲線，也看不出下方支撐。</p>\n<p>三、熱顯像儀顯示前方板面溫度異常升高，但外觀看起來沒有破損。</p>\n<p>四、無法辨識材質時，先用工具探測，必要時退回並建立安全路徑。</p>\n<p>五、穿著完整 PPE，就可以短暫踩踏採光罩。</p>\n<p>正確觀念是：距離短不代表風險低，裝備完整也不代表材質安全。</p>", "audio": "", "audioMediaType": ""}, {"number": 33, "key": "33", "title": "每一次停下來，都是為了全員回家", "sourceTextName": "33.txt", "sourceAudioName": "", "html": "<p>高處作業的危險，常常藏在看似平常的一步。</p>\n<p>本書從一件高處墜落事故出發，不是為了責備，而是為了建立更穩定、更容易執行的安全程序。</p>\n<p>記住五句話： 到梯頂，先停步。 腳出去，先探路。 材質不明，當禁區。 無探測，不跨步。 沒有路，先建路。</p>\n<p>每一次停下來確認，不是拖慢任務，而是讓任務可以繼續，讓每一位隊員都能平安回家。</p>", "audio": "", "audioMediaType": ""}];
    const book = document.getElementById("book");
    const toc = document.getElementById("toc");
    const chapterSelect = document.getElementById("chapterSelect");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const pageIndicator = document.getElementById("pageIndicator");
    const fontMinus = document.getElementById("fontMinus");
    const fontPlus = document.getElementById("fontPlus");
    let currentIndex = -1;
    let fontSize = 20;

    function stopAllAudio() {
      document.querySelectorAll("audio").forEach(audio => audio.pause());
    }
    function escapeHtml(value) {
      return String(value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function buildBook() {
      chapters.forEach((chapter, index) => {
        const article = document.createElement("article");
        article.className = "chapter";
        article.id = "chapter-" + index;
        const audioHtml = chapter.audio
          ? `<div class="audio-card"><audio controls preload="none"><source src="${chapter.audio}" type="${chapter.audioMediaType || "audio/mpeg"}">您的瀏覽器不支援音訊播放。</audio></div>`
          : "";
        article.innerHTML = `
          <header class="chapter-header">
            <h1 class="chapter-title">${escapeHtml(chapter.title)}</h1>
          </header>
          ${audioHtml}
          <div class="chapter-body">${chapter.html}</div>
        `;
        book.appendChild(article);

        const tocButton = document.createElement("button");
        tocButton.type = "button";
        tocButton.textContent = `${index + 1}. ${chapter.title}`;
        tocButton.addEventListener("click", () => showChapter(index));
        toc.appendChild(tocButton);

        const option = document.createElement("option");
        option.value = String(index);
        option.textContent = `${index + 1}. ${chapter.title}`;
        chapterSelect.appendChild(option);
      });

      const coverOption = document.createElement("option");
      coverOption.value = "-1";
      coverOption.textContent = "封面";
      chapterSelect.insertBefore(coverOption, chapterSelect.firstChild);
      chapterSelect.value = "-1";
    }
    function showChapter(index) {
      stopAllAudio();
      currentIndex = index;
      document.querySelectorAll(".cover, .chapter").forEach(el => el.classList.remove("active"));
      document.querySelectorAll(".toc button").forEach((button, i) => button.classList.toggle("active", i === index));
      if (index < 0) {
        document.getElementById("cover").classList.add("active");
        pageIndicator.textContent = "封面";
        chapterSelect.value = "-1";
      } else {
        document.getElementById("chapter-" + index).classList.add("active");
        pageIndicator.textContent = `${index + 1} / ${chapters.length}`;
        chapterSelect.value = String(index);
      }
      prevBtn.disabled = index <= -1;
      nextBtn.disabled = index >= chapters.length - 1;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
    prevBtn.addEventListener("click", () => { if (currentIndex > -1) showChapter(currentIndex - 1); });
    nextBtn.addEventListener("click", () => { if (currentIndex < chapters.length - 1) showChapter(currentIndex + 1); });
    chapterSelect.addEventListener("change", () => showChapter(Number(chapterSelect.value)));
    fontMinus.addEventListener("click", () => {
      fontSize = Math.max(16, fontSize - 2);
      document.documentElement.style.setProperty("--font-size", fontSize + "px");
    });
    fontPlus.addEventListener("click", () => {
      fontSize = Math.min(32, fontSize + 2);
      document.documentElement.style.setProperty("--font-size", fontSize + "px");
    });
    document.addEventListener("keydown", event => {
      if (event.key === "ArrowRight") nextBtn.click();
      if (event.key === "ArrowLeft") prevBtn.click();
    });
    buildBook();
    showChapter(-1);
  </script>
</body>
</html>
